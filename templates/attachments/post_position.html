{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="mb-4">Post Attachment Position</h3>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-success w-100">Post Position</button>
        </form>
        <a href="{% url 'company_dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
