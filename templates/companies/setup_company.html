{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow mt-4">
      <div class="card-body p-4">
        <h3 class="mb-4 text-center">Setup Company Profile</h3>
        <p class="text-muted text-center">Fill in your company details to get started</p>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-success w-100">Save Company Profile</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
